<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Galeries de Flashcards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- VUE 1 : Galerie de decks (Visible par défaut) -->
        <div id="gallery-view">
            <h1>Gallerie Révision Esilv (ROUSSET Colin)</h1>
            <div id="deck-list" class="deck-list"></div>
        </div>

        <!-- VUE 2 : Session de Flashcards (Cachée par défaut) -->
        <div id="card-view" class="hidden">
            <button id="back-to-gallery" class="nav-btn-sec">← Retour aux galeries</button>
            <h2 id="current-deck-title">Titre du paquet</h2>

            <div class="flashcard" id="flashcard">
                <div class="card-inner">
                    <div class="card-front" id="card-front">Question</div>
                    <div class="card-back" id="card-back">Réponse</div>
                </div>
            </div>

            <div class="actions">
                <button id="flip-btn" class="main-btn">Retourner la carte 🔄</button>
            </div>

            <div class="score-buttons">
                <button id="wrong-btn" class="score-btn wrong">Je ne savais pas ❌</button>
                <button id="correct-btn" class="score-btn correct">J'ai trouvé ! ✅</button>
            </div>

            <p id="counter">Carte 1 sur 1</p>
        </div>

        <!-- VUE 3 : Écran de fin (Caché par défaut) -->
        <div id="results-view" class="hidden">
            <h1>Session terminée ! 🎉</h1>
            <div class="score-card">
                <p>Ton score final :</p>
                <div id="final-score" class="score-number">0 / 0</div>
                <p id="score-message"></p>
            </div>
            <button id="restart-btn" class="main-btn">Recommencer</button>
            <button id="home-btn" class="nav-btn-sec">Retour aux galeries</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
