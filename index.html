<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%"><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
    <title>Flashcards - Cours</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">Flashcards - All & Cours A3/ESILV</div>
        <div class="nav-actions">
            <button class="icon-btn" title="Thème">☀️</button>
            <button class="icon-btn" title="GitHub">🐙</button>
        </div>
    </header>

    <main class="container">
        <!-- VUE GALERIE -->
        <section id="gallery-view">
            <div class="toolbar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Rechercher un deck ou mot...">
                </div>

                <div class="filter-pills" id="filter-pills">
                    <!-- Filtres injectés en JS -->
                </div>
            </div>

            <div class="catalog-count" id="catalog-count">3 catalogues disponibles</div>

            <div class="decks-grid" id="decks-grid">
                <!-- Decks injectés en JS -->
            </div>
        </section>

        <!-- VUE ÉTUDE DE FLASHCARDS -->
        <section id="study-view" class="hidden">
            <div class="study-header">
                <button id="back-to-decks-btn" class="btn-secondary">← Retour aux decks</button>
                <h2 id="study-deck-title">Titre du cours</h2>
            </div>

            <div class="flashcard-wrapper">
                <div class="flashcard" id="flashcard">
                    <div class="card-inner">
                        <div class="card-front" id="card-front">Question</div>
                        <div class="card-back" id="card-back">Réponse</div>
                    </div>
                </div>
            </div>

            <div class="study-controls">
                <button id="flip-btn" class="btn-primary">Retourner la carte 🔄</button>
            </div>

            <div class="rating-controls">
                <button id="wrong-btn" class="btn-rating wrong">À revoir ❌</button>
                <button id="correct-btn" class="btn-rating correct">Acquis ✅</button>
            </div>

            <div class="progress-counter" id="progress-counter">Carte 1 sur 10</div>
        </section>

        <!-- VUE SCORE / FIN -->
        <section id="score-view" class="hidden">
            <div class="score-card">
                <h2>Session terminée ! 🎉</h2>
                <div class="score-number" id="final-score">0 / 0</div>
                <p id="score-feedback"></p>
                <div class="score-actions">
                    <button id="restart-deck-btn" class="btn-primary">Recommencer</button>
                    <button id="home-btn" class="btn-secondary">Retour aux decks</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
